<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - DRA 2.0 POC</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>

  <body>
    <button id="themeToggle" class="theme-toggle" title="Toggle theme">☀️</button>

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
      <div style="width: 100%; max-width: 400px;">
        <div class="login-card" style="background: var(--bg-secondary); padding: 2rem; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <h1 style="text-align: center; margin-bottom: 2rem; color: var(--text-primary);">DRA 2.0 POC</h1>

          <form id="loginForm" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
              <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Username</label>
              <input 
                type="text" 
                id="username" 
                name="username" 
                required 
                placeholder="user"
                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.25rem; background: var(--bg-primary); color: var(--text-primary);"
              />
            </div>

            <div>
              <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Password</label>
              <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                placeholder="password"
                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.25rem; background: var(--bg-primary); color: var(--text-primary);"
              />
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">Login</button>
          </form>

          <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
            Demo credentials:
            <br />
            <code style="background-color: var(--bg-tertiary); padding: 0.25rem 0.5rem; border-radius: 0.25rem;">user</code> / 
            <code style="background-color: var(--bg-tertiary); padding: 0.25rem 0.5rem; border-radius: 0.25rem;">password</code>
          </p>
        </div>
      </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
      // Submits the credentials and stores the token on success.
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          
          if (response.ok) {
            const data = await response.json();
            localStorage.setItem('auth_token', data.token);
            window.location.href = '/dashboard.html';
          } else {
            alert('Login failed');
          }
        } catch (error) {
          console.error('Login error:', error);
          alert('Login failed');
        }
      });
    </script>
  </body>
</html>
