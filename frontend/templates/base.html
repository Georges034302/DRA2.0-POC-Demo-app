<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DRA 2.0 POC - Release Governance Proof of Concept" />
    <title>DRA 2.0 POC</title>

    <!-- Modern CSS Framework -->
    <link rel="stylesheet" href="/static/css/style.css" />

    <!-- HTMX for Dynamic Updates -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  </head>

  <body>
    <!-- Alert Container for Notifications -->
    <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; z-index: 2000;"></div>

    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-toggle" title="Toggle theme">☀️</button>

    <!-- Main Content -->
    <div id="pageContent"></div>

    <!-- Modal for Task Editing -->
    <dialog id="taskModal" class="modal">
      <div class="modal-content">
        <button class="modal-close" type="button">✕</button>
        <form id="taskForm" class="edit-form">
          <input type="hidden" id="taskId" />
          <input type="text" id="taskTitle" name="title" placeholder="Task title" required maxlength="120" />
          <textarea id="taskDesc" name="description" placeholder="Task description" maxlength="2000" rows="3"></textarea>
          <select id="taskPriority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <select id="taskStatus" name="status">
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
          <button type="submit" class="btn-primary">Save changes</button>
        </form>
      </div>
    </dialog>

    <!-- JS Script -->
    <script src="/static/js/app.js"></script>
  </body>
</html>
