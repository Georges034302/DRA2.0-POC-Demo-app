repos:
  - repo: local
    hooks:
      - id: ruff-scan
        name: Ruff Scan
        entry: python -m pytest tests/pre-commit/test_ruff_scan.py -v
        language: python
        additional_dependencies: ["pytest", "ruff"]
        pass_filenames: false
        stages: [pre-commit]
      - id: detect-secrets-scan
        name: detect-secrets Scan
        entry: python -m pytest tests/pre-commit/test_secrets_scan.py -v
        language: python
        additional_dependencies: ["pytest", "detect-secrets"]
        pass_filenames: false
        stages: [pre-commit]
      - id: pip-audit-scan
        name: pip-audit Scan
        entry: python -m pytest tests/pre-commit/test_dependency_audit.py -v
        language: python
        additional_dependencies: ["pytest", "pip-audit"]
        pass_filenames: false
        stages: [pre-commit]
