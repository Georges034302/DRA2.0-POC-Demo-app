version: '3.9'

services:
  # Frontend: Nginx reverse proxy serving UI and proxying /api to backend
  # Uses bridge network for cross-platform compatibility (Windows, macOS, Linux)
  frontend:
    build: ./frontend
    container_name: dra-frontend
    networks:
      - dra-network
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend: Flask API for authentication and task CRUD
  # Uses service DNS name for cross-platform compatibility
  backend:
    build: ./backend
    container_name: dra-backend
    networks:
      - dra-network
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DATABASE_SERVICE_URL: http://database:5001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      DEMO_USERNAME: ${DEMO_USERNAME:-user}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Database: Task storage and CRUD operations
  # Uses service DNS name for cross-platform networking
  database:
    build: ./database
    container_name: dra-database
    networks:
      - dra-network
    ports:
      - "5001:5001"
    environment:
      DATABASE_PATH: /data/tasks.db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  dra-network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
