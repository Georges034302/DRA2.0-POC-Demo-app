version: '3.9'

services:
  # Frontend: Nginx reverse proxy + static assets
  frontend:
    build: ./frontend
    container_name: dra-frontend
    network_mode: host
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend: Flask API + SQLite
  backend:
    build: ./backend
    container_name: dra-backend
    network_mode: host
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DATABASE_URL: sqlite:////data/tasks.db
      DEMO_USERNAME: ${DEMO_USERNAME:-user}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Database placeholder (future use - currently SQLite in backend)
  database:
    image: alpine:latest
    container_name: dra-database
    command: /bin/sh -c "echo 'Database placeholder - using SQLite in backend'"

networks:
  dra-network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local

