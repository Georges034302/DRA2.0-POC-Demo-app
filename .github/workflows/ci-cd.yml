name: DRA 2.0 CI/CD
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.broker.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test application
        run: |
          python -m pip install -r frontend/requirements.txt -r backend/requirements.txt -r database/requirements.txt
          python -m pytest frontend/tests backend/tests database/tests -q
          bash -n scripts/*.sh
      - name: Build application containers
        run: bash scripts/build.sh
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish tested source images to ACR
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          BUILD_MANIFEST: ${{ runner.temp }}/approved-build/images.json
        run: bash scripts/build.sh --publish
      - uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: ${{ runner.temp }}/approved-build/images.json
          if-no-files-found: error
      - name: Run private AI-Broker scanner
        id: broker
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ vars.GHCR_USER }}
          BROKER_IMAGE_DIGEST: ${{ vars.BROKER_IMAGE_DIGEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          BROKER_INPUT_DIR: ${{ runner.temp }}/broker-input
          BROKER_OUTPUT_DIR: ${{ runner.temp }}/broker-results
        run: bash scripts/review.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broker-review
          path: ${{ runner.temp }}/broker-results/
          if-no-files-found: warn
      - name: Block all non-approved outcomes
        if: steps.broker.outputs.decision != 'PASS' && steps.broker.outputs.decision != 'APPROVAL_REQUIRED'
        run: exit 1
  approval:
    needs: review
    if: needs.review.outputs.decision == 'APPROVAL_REQUIRED'
    runs-on: ubuntu-latest
    environment: dra-approval
    steps:
      - name: Check approval gate is explicitly enabled
        env:
          APPROVAL_GATE_ENABLED: ${{ vars.APPROVAL_GATE_ENABLED }}
        run: |
          test "$APPROVAL_GATE_ENABLED" = true || { echo 'Human approval is not enabled' >&2; exit 1; }
  deploy:
    needs: [review, approval]
    if: ${{ always() && needs.review.result == 'success' && (needs.review.outputs.decision == 'PASS' || (needs.review.outputs.decision == 'APPROVAL_REQUIRED' && needs.approval.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-manifest
          path: ${{ runner.temp }}/approved-build
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy approved application image digests
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPPS_ENV: ${{ vars.AZURE_CONTAINERAPPS_ENV }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          AZURE_DATABASE_APP: ${{ vars.AZURE_DATABASE_APP }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          BUILD_MANIFEST: ${{ runner.temp }}/approved-build/images.json
        run: bash scripts/deploy.sh
  verify-deployment-job:
    needs: [review, approval, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require completed deployment
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: test "$DEPLOY_RESULT" = success
