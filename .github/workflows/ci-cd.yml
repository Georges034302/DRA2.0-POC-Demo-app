name: DRA 2.0 CI/CD
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt -r database/requirements.txt
      - name: Run DB/TASKS/SECURITY suites and produce test report
        run: bash scripts/post-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: temp/reports/test_report.md
          if-no-files-found: error
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application containers
        run: bash scripts/build.sh
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish tested source images to ACR
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          GITHUB_SHA: ${{ github.sha }}
          BUILD_MANIFEST: ${{ runner.temp }}/approved-build/images.json
        run: bash scripts/build.sh --publish
      - uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: ${{ runner.temp }}/approved-build/images.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: temp/reports/build_report.md
          if-no-files-found: error
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-manifest
          path: ${{ runner.temp }}/approved-build
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy approved image digests to the dev stage
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          STAGE: dev
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          BUILD_MANIFEST: ${{ runner.temp }}/approved-build/images.json
        run: bash scripts/deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: temp/reports/deployment_report.md
          if-no-files-found: error
  verify-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Collect dev-stage health evidence
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          STAGE: dev
        run: bash scripts/post-deploy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-report
          path: temp/reports/results.md
          if-no-files-found: error
  review:
    needs: [test, build, deploy-dev, verify-dev]
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.broker.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-report'
          merge-multiple: true
          path: temp/reports
      - name: Run private AI-Broker scanner
        id: broker
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ vars.GHCR_USER }}
          BROKER_IMAGE_DIGEST: ${{ vars.BROKER_IMAGE_DIGEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GITHUB_SHA: ${{ github.sha }}
          BROKER_INPUT_DIR: ${{ runner.temp }}/broker-input
          BROKER_OUTPUT_DIR: ${{ runner.temp }}/broker-results
        run: bash scripts/review.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broker-review
          path: ${{ runner.temp }}/broker-results/
          if-no-files-found: warn
      - name: Block all non-approved outcomes
        if: steps.broker.outputs.decision != 'PASS' && steps.broker.outputs.decision != 'APPROVAL_REQUIRED'
        run: exit 1
  approval:
    needs: review
    if: needs.review.outputs.decision == 'APPROVAL_REQUIRED'
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.APPROVAL_ENVIRONMENT || 'dra-approval' }}
    steps:
      - name: Check approval gate is explicitly enabled
        env:
          APPROVAL_GATE_ENABLED: ${{ vars.APPROVAL_GATE_ENABLED }}
        run: |
          test "$APPROVAL_GATE_ENABLED" = true || { echo 'Human approval is not enabled' >&2; exit 1; }
  promote:
    needs: [build, review, approval]
    if: ${{ always() && needs.review.result == 'success' && (needs.review.outputs.decision == 'PASS' || (needs.review.outputs.decision == 'APPROVAL_REQUIRED' && needs.approval.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-manifest
          path: ${{ runner.temp }}/approved-build
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Promote approved image digests to production
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          STAGE: prod
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          BUILD_MANIFEST: ${{ runner.temp }}/approved-build/images.json
        run: bash scripts/deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: promote-report
          path: temp/reports/deployment_report.md
          if-no-files-found: error
  verify-promotion-job:
    needs: [review, approval, promote]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require completed promotion
        env:
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: test "$PROMOTE_RESULT" = success
